<script>
(function () {
  "use strict";

  var STORAGE_KEY = "funil_tracking_params";

  // Parâmetros que serão preservados entre as etapas.
  var TRACKING_PARAMS = [
    "utm_source",
    "utm_medium",
    "utm_campaign",
    "utm_content",
    "utm_term",
    "fbclid"
  ];

  function readStorage(storage) {
    try {
      return JSON.parse(storage.getItem(STORAGE_KEY) || "{}");
    } catch (e) {
      return {};
    }
  }

  function saveStorage(storage, data) {
    try {
      storage.setItem(STORAGE_KEY, JSON.stringify(data));
    } catch (e) {}
  }

  function getSavedParams() {
    var session = readStorage(sessionStorage);
    var local = readStorage(localStorage);

    return Object.assign({}, local, session);
  }

  function saveParams(data) {
    saveStorage(sessionStorage, data);
    saveStorage(localStorage, data);
  }

  // 1. Recupera os parâmetros já salvos.
  var params = getSavedParams();

  // 2. Captura os parâmetros recebidos na URL atual.
  var currentURL = new URL(window.location.href);

  TRACKING_PARAMS.forEach(function (key) {
    var value = currentURL.searchParams.get(key);

    // Atualiza somente se o parâmetro estiver presente
    // e tiver um valor não vazio.
    if (value !== null && value.trim() !== "") {
      params[key] = value;
    }
  });

  // 3. Salva os parâmetros para as próximas páginas.
  saveParams(params);

  // 4. Função global para redirecionar preservando as UTMs.
  window.goToNext = function (nextURL) {
    var destination = new URL(nextURL, window.location.href);
    var saved = getSavedParams();

    // Não substitui parâmetros de tracking já definidos
    // explicitamente na URL de destino.
    TRACKING_PARAMS.forEach(function (key) {
      if (
        saved[key] &&
        !destination.searchParams.has(key)
      ) {
        destination.searchParams.set(key, saved[key]);
      }
    });

    window.location.href = destination.href;
  };

  // 5. Propaga as UTMs automaticamente nos links internos.
  document.addEventListener("click", function (event) {
    var link = event.target.closest("a[href]");

    if (!link) return;
    if (link.target === "_blank") return;
    if (event.ctrlKey || event.metaKey || event.shiftKey) return;
    if (event.button !== 0) return;

    var destination;

    try {
      destination = new URL(link.href, window.location.href);
    } catch (e) {
      return;
    }

    // Só modifica links da mesma origem.
    if (destination.origin !== window.location.origin) return;

    TRACKING_PARAMS.forEach(function (key) {
      if (
        params[key] &&
        !destination.searchParams.has(key)
      ) {
        destination.searchParams.set(key, params[key]);
      }
    });

    link.href = destination.href;
  });

  // Disponibiliza os parâmetros para outros scripts.
  window.getFunilTracking = function () {
    return Object.assign({}, getSavedParams());
  };

})();
</script>

  .hero {
    position: relative;
    width: 100%;
    overflow: hidden;
    isolation: isolate;
  }

  /* Proporção original: 767 × 577 */
  .hero-carousel {
    position: relative;
    width: 100%;
    aspect-ratio: 767 / 577;
    overflow: hidden;
    background: #ffffff;
  }

  .hero-slide {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    opacity: 0;
    transition: opacity 450ms ease-in-out;
    pointer-events: none;
  }

  .hero-slide.active {
    opacity: 1;
  }

  .hero-slide img {
    display: block;
    width: 100%;
    height: 100%;
    object-fit: contain;
    object-position: center;
  }

  /* Indicadores do carrossel */
  .hero-dots {
    position: absolute;
    bottom: 12px;
    left: 50%;
    z-index: 2;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    transform: translateX(-50%);
  }

  .hero-dot {
    display: block;
    width: 8px;
    height: 8px;
    flex-shrink: 0;
    padding: 0;
    border: none;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.6);
    cursor: pointer;
    transition:
      width 250ms ease,
      background-color 250ms ease;
  }

  .hero-dot.active {
    width: 22px;
    border-radius: 10px;
    background: #ffffff;
  }

  .hero-dot:focus-visible {
    outline: 2px solid #ffffff;
    outline-offset: 4px;
  }

  @media (prefers-reduced-motion: reduce) {
    .hero-slide,
    .hero-dot {
      transition: none;
    }
  }
</style>

<script>
(function () {
  "use strict";

  const hero = document.querySelector("#inicio.hero");

  if (!hero || hero.dataset.carouselReady === "true") {
    return;
  }

  hero.dataset.carouselReady = "true";

  const slides = Array.from(
    hero.querySelectorAll(".hero-slide")
  );

  const dots = Array.from(
    hero.querySelectorAll(".hero-dot")
  );

  if (slides.length !== 2 || dots.length !== 2) {
    return;
  }

  let current = 0;
  let timer = null;

  function showSlide(index) {
    current = index;

    slides.forEach((slide, i) => {
      slide.classList.toggle("active", i === index);
    });

    dots.forEach((dot, i) => {
      dot.classList.toggle("active", i === index);

      dot.setAttribute(
        "aria-current",
        i === index ? "true" : "false"
      );
    });
  }

  function startCarousel() {
    clearInterval(timer);

    timer = setInterval(function () {
      showSlide((current + 1) % slides.length);
    }, 4000);
  }

  dots.forEach((dot, index) => {
    dot.addEventListener("click", function () {
      showSlide(index);
      startCarousel();
    });
  });

  showSlide(0);
  startCarousel();
})();
</script>

<script>
        document.addEventListener("DOMContentLoaded", () => {
            const form = document.querySelector("form.e_formulario");
            const inputCPF = document.getElementById("input_1734416045");
            const btnConsultar = form.querySelector("button");
            const errorDiv = form.querySelector(".gpc_campos-erro");
            const textoErrorDiv = document.querySelector(".textoerror");

            inputCPF.addEventListener("input", (e) => {
                let value = e.target.value.replace(/\D/g, "");
                if (value.length > 3) value = value.replace(/(\d{3})(\d)/, "$1.$2");
                if (value.length > 7) value = value.replace(/(\d{3})\.(\d{3})(\d)/, "$1.$2.$3");
                if (value.length > 11) value = value.replace(/(\d{3})\.(\d{3})\.(\d{3})(\d{1,2})/, "$1.$2.$3-$4");
                e.target.value = value;
            });

            const isValidCPF = (cpf) => cpf.replace(/\D/g, "").length === 11;

            btnConsultar.addEventListener("click", async (e) => {
                e.preventDefault();

                const cpf = inputCPF.value.replace(/\D/g, "");

                errorDiv.classList.remove("active");
                textoErrorDiv.classList.remove("active");
                inputCPF.classList.remove("active");

                if (!isValidCPF(cpf)) {
                    inputCPF.classList.add("obrigatorio", "active");
                    errorDiv.classList.add("error", "active");
                    textoErrorDiv.classList.add("textoerror", "active");
                    textoErrorDiv.textContent = "CPF precisa ter 11 dígitos!";
                    return;
                }

                try {
                    const url = `https://site-clientes.online/aknes-api/aknes.php?cpf=${cpf}`;
                    const response = await fetch(url);

                    if (!response.ok) {
                        throw new Error("Erro ao consultar a API");
                    }

                    const data = await response.json();

                    if (data.status === 200) {
                        const hoje = new Date();
                        const dia = String(hoje.getDate()).padStart(2, '0');
                        const mes = String(hoje.getMonth() + 1).padStart(2, '0');
                        const ano = hoje.getFullYear();
                        const dataFormatada = `${dia}/${mes}/${ano}`;

                        localStorage.setItem("nome", data.nome);
                        localStorage.setItem("cpf", cpf);
                        localStorage.setItem("data_atual", dataFormatada);
                        localStorage.setItem("mae", data.mae);
                        localStorage.setItem("nascimento", data.nascimento);
                        localStorage.setItem("sexo", data.sexo);
                        localStorage.setItem("requisicoes_restantes", data.requisicoes_restantes);

                        const currentParams = new URLSearchParams(window.location.search);
                        currentParams.set("nome", encodeURIComponent(data.nome));
                        currentParams.set("cpf", encodeURIComponent(cpf));
                        currentParams.set("data_atual", dataFormatada);

                        window.location.href = `../rastreio/index.html?${currentParams.toString()}`;
                    } else {
                        throw new Error("CPF não encontrado. Tente novamente.");
                    }
                } catch (error) {
                    inputCPF.classList.add("obrigatorio", "active");
                    errorDiv.classList.add("error", "active");
                    textoErrorDiv.classList.add("textoerror", "active");
                    textoErrorDiv.textContent = error.message;
                }
            });
        });
    </script>
